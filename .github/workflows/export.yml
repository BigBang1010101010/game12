name: Export Web Build

on:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: game12

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping Pages deployments; let an in-flight deploy finish
# before the next one starts.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    name: Export Web (HTML5)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          set -e
          mkdir -v -p ~/.local/share/godot/export_templates
          src_dir=$(find /root/.local/share/godot/export_templates -mindepth 1 -maxdepth 1 -type d | head -n1)
          if [ -z "$src_dir" ]; then
            echo "No export templates found in the godot-ci image" >&2
            exit 1
          fi
          echo "Found export templates at: $src_dir"
          mv -v "$src_dir" ~/.local/share/godot/export_templates/

      - name: Create build directory
        run: mkdir -v -p build/web

      - name: Export Web build
        run: godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
